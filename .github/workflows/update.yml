name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    # Werktags 07:30 und 22:30 Uhr Wiener Winterzeit (06:30 / 21:30 UTC)
    - cron: "30 6 * * 1-5"
    - cron: "30 21 * * 1-5"
    # Samstag früh: Wochenschluss
    - cron: "30 6 * * 6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten holen
        run: python scripts/fetch_data.py
      - name: Datenstand speichern
        run: |
          git config user.name "marktpuls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/history.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

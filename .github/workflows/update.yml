name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    # Alle 15 Minuten; der Job "check" lässt nur Läufe werktags 7:25–23:00 und
    # samstags 7:25–8:15 Wiener Zeit durch (Sommer- und Winterzeit).
    # Kennzahlen, Einzelwerte-Stammdaten, Zinsen und Meldungen holt fetch_data.py --mode auto
    # nur beim ersten Lauf nach 7:30, 9:30, 14:30, 18:30 und 22:30 Uhr (Vollabruf).
    - cron: "*/15 5-22 * * 1-5"
    - cron: "*/15 5-7 * * 6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.win.outputs.run }}
    steps:
      - id: win
        name: Zeitfenster prüfen
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            dow=$(TZ=Europe/Vienna date +%u); hm=$(TZ=Europe/Vienna date +%H%M)
            if [ "$dow" -le 5 ]; then
              { [ "$hm" -ge 0725 ] && [ "$hm" -le 2300 ]; } || run=false
            elif [ "$dow" -eq 6 ]; then
              { [ "$hm" -ge 0725 ] && [ "$hm" -le 0815 ]; } || run=false
            else
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Wien $(TZ=Europe/Vienna date '+%a %H:%M'), Lauf: $run"

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten holen
        run: python scripts/fetch_data.py --mode auto
      - name: Datenstand speichern (nur nach Vollabruf)
        run: |
          full=$(python -c "import json;d=json.load(open('docs/stamp.json'));print(d['generated']==d['fullGenerated'])")
          echo "Vollabruf: $full"
          if [ "$full" = "True" ]; then
            git config user.name "marktpuls-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/data.json docs/history.json docs/stamp.json cache/infos.json
            git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%F)"
            git pull --rebase -X theirs origin main || true
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    # Wiener Zeit werktags 7:30, 9:30, 14:30, 18:30, 22:30 und samstags 7:30.
    # GitHub plant in UTC, daher je ein Satz für Winterzeit (UTC+1) und Sommerzeit (UTC+2);
    # der Schritt "Zeitfenster prüfen" lässt nur den passenden Satz laufen.
    - cron: "30 6,8,13,17,21 * * 1-5"   # Winterzeit
    - cron: "30 6 * * 6"                # Winterzeit, Samstag
    - cron: "30 5,7,12,16,20 * * 1-5"   # Sommerzeit
    - cron: "30 5 * * 6"                # Sommerzeit, Samstag
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.win.outputs.run }}
    steps:
      - id: win
        name: Zeitfenster prüfen
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            off=$(TZ=Europe/Vienna date +%z)
            case "$CRON" in
              "30 6,8,13,17,21 * * 1-5"|"30 6 * * 6") want=+0100 ;;
              *) want=+0200 ;;
            esac
            [ "$off" = "$want" ] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Wien $(TZ=Europe/Vienna date '+%H:%M %z'), Lauf: $run"

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten holen
        run: python scripts/fetch_data.py
      - name: Datenstand speichern
        run: |
          git config user.name "marktpuls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/history.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
